services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: supermarket-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - supermarket-network

  nginx:
    image: nginx:1.25-alpine
    container_name: supermarket-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - supermarket-network

  db:
    image: mysql:8.0
    container_name: supermarket-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-supermarket}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-supermarket}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - supermarket-network

  redis:
    image: redis:7.2-alpine
    container_name: supermarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - supermarket-network

  node:
    image: node:20-alpine
    container_name: supermarket-node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - supermarket-network

volumes:
  db-data:
  redis-data:

networks:
  supermarket-network:
    driver: bridge
