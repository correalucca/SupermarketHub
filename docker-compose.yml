services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: supermarket-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - supermarket-network

  nginx:
    image: nginx:1.25-alpine
    container_name: supermarket-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - supermarket-network

  db:
    image: mysql:8.0
    container_name: supermarket-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-supermarket}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-supermarket}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - supermarket-network

  redis:
    image: redis:7.2-alpine
    container_name: supermarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - supermarket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: supermarket-frontend:latest
    container_name: supermarket-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - supermarket-network

  frontend-dev:
    image: node:22-alpine
    container_name: supermarket-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - nginx
    networks:
      - supermarket-network

  # Executa a suíte do frontend com node_modules no filesystem do container
  # (o bind-mount do frontend-dev torna o I/O de deps muito lento no Windows).
  # Uso: docker compose run --rm frontend-tests
  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.tests
    container_name: supermarket-frontend-tests
    working_dir: /app
    volumes:
      - ./frontend/src:/app/src
    networks:
      - supermarket-network

volumes:
  db-data:
  redis-data:

networks:
  supermarket-network:
    driver: bridge
